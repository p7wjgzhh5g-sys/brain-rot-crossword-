<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Crossword - Free Word Puzzle</title>
    
    <!-- Optional: Google AdSense Script Placeholder -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --text: #f8fafc;
            --tile-bg: #334155;
            --tile-correct: #22c55e;
            --tile-selected: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        /* Ad Banners */
        .ad-banner {
            width: 100%;
            max-width: 420px;
            height: 60px;
            background: var(--card-bg);
            border: 1px dashed #475569;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Header */
        header {
            text-align: center;
            margin: 10px 0;
        }

        h1 {
            font-size: 26px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }

        /* Main Game Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin: 10px 0;
        }

        .tile {
            width: 58px;
            height: 58px;
            background: var(--tile-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .tile.black {
            background: transparent;
            cursor: default;
        }

        .tile.selected {
            background-color: var(--tile-selected);
            color: #0f172a;
            transform: scale(1.05);
        }

        .tile.correct {
            background-color: var(--tile-correct);
            color: #ffffff;
        }

        /* Clues Section */
        .clues-container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .clues-title {
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .clue-item {
            margin-bottom: 4px;
            color: #94a3b8;
        }

        .clue-item span {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        /* Win Popup */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
            text-align: center;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal h2 {
            font-size: 32px;
            color: #22c55e;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- TOP AD PLACEHOLDER -->
    <div class="ad-banner">ADVERTISEMENT</div>

    <header>
        <h1>Brainrot Crossword</h1>
        <div class="stats-bar">
            <div>Level: <span id="level-display" style="color:var(--accent); font-weight:bold;">1</span></div>
            <div>Score: <span id="score-display" style="color:#22c55e; font-weight:bold;">0</span></div>
        </div>
    </header>

    <div class="grid-container" id="grid"></div>

    <div class="clues-container">
        <div class="clues-title">Across & Down Clues:</div>
        <div id="clues-list"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="checkSolution()">Submit Words</button>
        <button class="btn" style="background:#475569;" onclick="shuffleTiles()">Shuffle</button>
    </div>

    <!-- BOTTOM AD PLACEHOLDER -->
    <div class="ad-banner">ADVERTISEMENT</div>

    <!-- WIN MODAL -->
    <div class="modal" id="win-modal">
        <h2>MAX RIZZ! 🔥</h2>
        <p style="margin-bottom: 15px; font-size: 18px;">You solved the Brainrot Crossword!</p>
        <button class="btn" onclick="nextLevel()">Next Level</button>
    </div>

    <script>
        // Clean Gen-Alpha word levels & clues
        const levels = [
            {
                // 5x5 Grid (1 = black tile)
                gridPattern: [
                    ['S','K','I','B','I'],
                    ['I', 1 , 1 , 1 ,'M'],
                    ['G','Y','A','T','T'],
                    ['M', 1 , 1 , 1 ,'E'],
                    ['A','U','R','A', 1 ]
                ],
                clues: [
                    "Across 1: The famous toilet meme prefix (SKIBIDI)",
                    "Across 3: Expression used when someone looks cool (GYATT)",
                    "Across 5: Charisma or cool presence points (AURA)",
                    "Down 1: A confident, independent leader (SIGMA)",
                    "Down 5: Coolness / style points (IMTE -> MITE)"
                ]
            },
            {
                gridPattern: [
                    ['R','I','Z','Z', 1 ],
                    ['O', 1 , 1 ,'A', 1 ],
                    ['B','A','S','E','D'],
                    ['L', 1 , 1 ,'O','U'],
                    ['O','X','Y','T','E']
                ],
                clues: [
                    "Across 1: Skill at charming people / charismatic flirty energy (RIZZ)",
                    "Across 3: Unapologetically being yourself / true facts (BASED)",
                    "Down 1: Popular block game where obbys exist (ROBLOX)",
                    "Down 4: Cool, smooth, or legendary vibes (ZAZO)"
                ]
            }
        ];

        let currentLevelIdx = 0;
        let selectedTile = null;
        let gridData = [];
        let score = 0;

        function loadLevel(idx) {
            const level = levels[idx % levels.length];
            const gridEl = document.getElementById('grid');
            const cluesEl = document.getElementById('clues-list');
            gridEl.innerHTML = '';
            cluesEl.innerHTML = '';

            // Load clues
            level.clues.forEach(c => {
                const div = document.createElement('div');
                div.className = 'clue-item';
                div.innerHTML = c;
                cluesEl.appendChild(div);
            });

            // Extract all letters for scrambling
            let letters = [];
            gridData = JSON.parse(JSON.stringify(level.gridPattern));
            
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (gridData[r][c] !== 1) {
                        letters.push(gridData[r][c]);
                    }
                }
            }

            // Scramble non-black letters
            letters.sort(() => Math.random() - 0.5);

            // Render Grid
            let letterIdx = 0;
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.row = r;
                    tile.dataset.col = c;

                    if (gridData[r][c] === 1) {
                        tile.classList.add('black');
                    } else {
                        tile.innerText = letters[letterIdx];
                        tile.addEventListener('click', () => handleTileClick(tile));
                        letterIdx++;
                    }
                    gridEl.appendChild(tile);
                }
            }
        }

        function handleTileClick(tile) {
            if (tile.classList.contains('black') || tile.classList.contains('correct')) return;

            if (!selectedTile) {
                selectedTile = tile;
                tile.classList.add('selected');
            } else if (selectedTile === tile) {
                selectedTile.classList.remove('selected');
                selectedTile = null;
            } else {
                // Swap values
                const temp = selectedTile.innerText;
                selectedTile.innerText = tile.innerText;
                tile.innerText = temp;

                selectedTile.classList.remove('selected');
                selectedTile = null;
            }
        }

        function shuffleTiles() {
            const tiles = Array.from(document.querySelectorAll('.tile:not(.black):not(.correct)'));
            const letters = tiles.map(t => t.innerText).sort(() => Math.random() - 0.5);
            tiles.forEach((t, i) => t.innerText = letters[i]);
        }

        function checkSolution() {
            const level = levels[currentLevelIdx % levels.length];
            const tiles = document.querySelectorAll('.tile');
            let allCorrect = true;

            tiles.forEach(tile => {
                if (tile.classList.contains('black')) return;
                const r = tile.dataset.row;
                const c = tile.dataset.col;
                const expected = level.gridPattern[r][c];

                if (tile.innerText === expected) {
                    tile.classList.add('correct');
                } else {
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                score += 100;
                document.getElementById('score-display').innerText = score;
                document.getElementById('win-modal').classList.add('active');
            }
        }

        function nextLevel() {
            document.getElementById('win-modal').classList.remove('active');
            currentLevelIdx++;
            document.getElementById('level-display').innerText = currentLevelIdx + 1;
            loadLevel(currentLevelIdx);
        }

        // Initialize Level 1
        loadLevel(0);
    </script>
</body>
</html>
